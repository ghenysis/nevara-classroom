name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install -r requirements.txt || pip install Django djangorestframework djangorestframework-simplejwt django-cors-headers celery redis
      - name: Syntax check
        run: |
          python -m compileall apps core manage.py || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install || true
      - name: Build
        run: npm run build || true
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
